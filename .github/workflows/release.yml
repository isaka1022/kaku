name: release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Package extension
        run: npx @vscode/vsce package -o kaku.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: kaku.vsix

  # The two registries are independent. Publishing the same artifact to both is
  # one release, but a credential problem at one must not withhold the other.
  vscode-marketplace:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath kaku.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Publish to Open VSX
        run: npx ovsx publish kaku.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
